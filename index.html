<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Networking Basics — Understanding How Devices Communicate</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/diagrams.css" />
</head>
<body>
  <div id="app">
    <!-- Animated backgrounds -->
    <div id="bg-grid"></div>
    <div id="bg-animated"></div>

    <!-- Top bar -->
    <div class="top-bar">
      <div class="title">NETWORKING <span class="accent">BASICS</span></div>
      <div class="counter">
        <span id="counter">01</span> / <span id="total">34</span>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>

    <!-- Presentation -->
    <div class="presentation">
      <div class="slides" id="slides">
        <!-- Slides are generated dynamically by app.js -->
      </div>
    </div>

    <!-- Progress dots -->
    <div class="progress-dots" id="progress-dots"></div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-prev" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <button class="btn btn-next" aria-label="Next slide">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.59 5.59L14 20l8-8z"/></svg>
      </button>
      <button class="btn btn-fullscreen" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m0 8v3a2 2 0 0 0 2 2h3m8-13h3a2 2 0 0 1 2 2v3m0 8v3a2 2 0 0 1-2 2h-3"/></svg>
      </button>
      <button class="btn btn-notes" aria-label="Toggle speaker notes">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17l-1.17 1.17V4h16v12z"/></svg>
      </button>
    </div>

    <!-- Speaker Notes -->
    <div class="speaker-notes">
      <h4>Speaker Notes</h4>
      <div class="notes-text"></div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/slides.js"></script>
  <script src="js/diagram-svgs.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
